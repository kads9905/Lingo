services:
  - type: web
    name: lingo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ML_WORKER_URL
        sync: false
      - key: WORKER_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
